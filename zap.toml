# The zaplang-io/aws repo manifest. This root project is the aws-core ORACLE
# HARNESS: it depends on the local `aws-core` package and drives its offline
# conformance suite (tests/) and the live examples (examples/) as real Zap
# programs that `import aws_core.<module>` — the same way the generated
# per-service clients (aws-codegen) consume it. It is the first consumer of the
# aws-core package, so the suite dogfoods the import contract.
#
# The shipping SDK is the GENERATED clients (aws-codegen, D-0001); the hand-
# written aws-core package in this repo is the runtime those clients ride on and
# the byte-diff oracle they are diffed against. See DECISIONS.md.
#
# Build: the aws-core modules are linked via real Zap module imports
# (zaplang-io/zap#283), not the retired tools/bundle.py concatenation. CI
# materializes the dependency with `zap zenv create` and runs each entry with the
# zenv active (`source zenv/activate`).
[package]
name = "aws"
version = "0.1.0"

[dependencies]
aws_core = { path = "aws-core" }
